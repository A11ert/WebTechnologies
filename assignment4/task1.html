<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book a train ticket</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/task1.css">
</head>
<body>
<main class="container py-4">
    <div class="ticket-card">
        <div class="ticket-header p-4 p-md-5">
            <h1 class="fw-bold m-0">Book a train ticket</h1>
        </div>

        <form class="p-4 p-md-5">
            <div class="btn-group d-flex d-md-inline-flex mb-4">
                <input type="radio" class="btn-check" name="trip" id="oneWay" checked>
                <label class="btn btn-outline-success btn-trip px-4 fw-semibold" for="oneWay">One way</label>
                <input type="radio" class="btn-check" name="trip" id="roundTrip">
                <label class="btn btn-outline-success btn-trip px-4 fw-semibold" for="roundTrip">Round trip</label>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="from" name="from" placeholder="From" required>
                        <label for="from">From</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="to" name="to" placeholder="To" required>
                        <label for="to">To</label>
                    </div>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label for="departure" class="form-label fw-semibold">Departure</label>
                    <input type="date" class="form-control" id="departure" name="departure" required>
                </div>
                <div class="col-md-4">
                    <label for="return" class="form-label fw-semibold">Return</label>
                    <input type="date" class="form-control" id="return" name="return">
                </div>
                <div class="col-md-4">
                    <label for="passengers" class="form-label fw-semibold">Passengers</label>
                    <select class="form-select" id="passengers" name="passengers">
                        <option>1 adult</option>
                        <option>2 adults</option>
                        <option>3 adults</option>
                        <option>4 adults</option>
                        <option>5 adults</option>
                        <option>6 adults</option>
                    </select>
                </div>
            </div>

            <fieldset class="mb-4">
                <legend class="fs-6 fw-semibold">Carriage class</legend>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="carriage" id="seat" required>
                    <label class="form-check-label" for="seat">Seat</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="carriage" id="coupe">
                    <label class="form-check-label" for="coupe">Coupé</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="carriage" id="sleeper">
                    <label class="form-check-label" for="sleeper">Sleeper</label>
                </div>
            </fieldset>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="phone" class="form-label fw-semibold">Phone</label>
                    <div class="input-group">
                        <span class="input-group-text phone-code">+7</span>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                <label class="form-check-label" for="agree">I agree with the carriage rules</label>
            </div>

            <div class="d-grid gap-3 d-md-flex justify-content-md-end">
                <button type="reset" class="btn btn-outline-dark btn-clear btn-lg rounded-pill px-5 fw-bold">Clear</button>
                <button type="submit" class="btn btn-warning btn-find btn-lg rounded-pill px-5 fw-bold order-first order-md-0">Find trains</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
