<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 2 - The Party in Motion</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Geist:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/script.js" defer></script>
</head>
<body>
<header>
    <h1>The Party in Motion</h1>
    <p>Click a case to spotlight it, click a guest to open the card, sort a room by time.</p>
</header>

<main>
    <div id="house"></div>

    <aside id="panel">
        <h2>Cases</h2>
        <div id="result" aria-live="polite">Choose a case.</div>
        <button id="clear">Clear</button>
        <div id="cases"></div>
    </aside>
</main>

<div id="info">
    <div class="info-inner"></div>
</div>
</body>
</html>
